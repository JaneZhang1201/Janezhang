<footer class="site-footer">
  <div class="container footer-inner">
    <p>&copy; {% now "Y" %} {{ site_profile.name|default:"Jane Zhang" }}</p>
    <ul class="footer-links">
      {% if site_profile.github_url %}<li><a href="{{ site_profile.github_url }}" rel="me">GitHub</a></li>{% endif %}
      {% if site_profile.linkedin_url %}<li><a href="{{ site_profile.linkedin_url }}" rel="me">LinkedIn</a></li>{% endif %}
      <li><a href="{% url 'contact' %}">Get in touch</a></li>
    </ul>
  </div>
</footer>
