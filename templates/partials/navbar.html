{% with section=request.resolver_match.namespace|default:request.resolver_match.url_name %}
<header class="site-header">
  <nav class="container nav" aria-label="Main">
    <a class="brand" href="{% url 'home' %}">{{ site_profile.name|default:"Jane Zhang" }}</a>
    <ul class="nav-links">
      <li><a href="{% url 'home' %}" {% if section == 'home' %}aria-current="page"{% endif %}>Home</a></li>
      <li><a href="{% url 'projects:list' %}" {% if section == 'projects' %}aria-current="page"{% endif %}>Projects</a></li>
      <li><a href="{% url 'blog:list' %}" {% if section == 'blog' %}aria-current="page"{% endif %}>Blog</a></li>
      <li><a href="{% url 'cv' %}" {% if section == 'cv' %}aria-current="page"{% endif %}>CV</a></li>
      <li><a href="{% url 'contact' %}" {% if section == 'contact' %}aria-current="page"{% endif %}>Contact</a></li>
    </ul>
  </nav>
</header>
{% endwith %}
